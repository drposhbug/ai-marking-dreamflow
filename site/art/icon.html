<!doctype html>
<!--
  The UMarkless mark, drawn at any size: a chalkboard-green tile, lit the
  way the whole product is lit — from the top left — with the tick in the
  site's paper cream. It replaces the blue tile the app shipped with before
  the palette moved to the marked-paper scheme.

  Rendered to every PNG the product uses by site/art/render_icon.mjs:
    ?size=1024&shape=tile      the tile with rounded corners (app icons)
    ?size=1024&shape=square    full-bleed board (adaptive-icon background
                               takes the rounding; the foreground is the
                               tick alone)
    ?size=1024&shape=fg        the tick alone on transparency, inset for
                               Android's adaptive safe zone
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #tile { position: relative; overflow: hidden; }
  #tile.rounded { border-radius: 22.5%; }
  #tile.painted {
    background:
      radial-gradient(120% 120% at 18% 12%, #1E4A38 0%, #143528 55%, #0E271E 100%);
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="tile"></div>
<script>
  const p = new URLSearchParams(location.search);
  const size = parseInt(p.get('size') || '1024', 10);
  const shape = p.get('shape') || 'tile';
  const tile = document.getElementById('tile');
  tile.style.width = tile.style.height = size + 'px';
  if (shape !== 'fg') tile.classList.add('painted');
  if (shape === 'tile') tile.classList.add('rounded');
  // The tick: cream, round-capped, drawn with the same proportions as the
  // splash screen's. For the adaptive foreground it sits well inside the
  // safe zone, since launchers crop the outer third.
  const inset = shape === 'fg' ? 0.24 : 0;
  const s = (v) => v * (1 - inset * 2) + inset * 100;
  tile.insertAdjacentHTML('beforeend', `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M ${s(26)} ${s(52)} L ${s(43.5)} ${s(69.5)} L ${s(74)} ${s(34)}"
            fill="none" stroke="#F6F1E3" stroke-width="${11 * (1 - inset * 2)}"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`);
  document.body.dataset.ready = '1';
</script>
</body>
</html>
