<!doctype html>
<!--
  The textures for site/art/marking-scan.blend, drawn in the browser so the
  text is real type rather than grey bars standing in for it.

    worksheet.html?layer=paper    the student's sheet as it sits on the desk
    worksheet.html?layer=scan     the phone's viewfinder, page detected
    worksheet.html?layer=marked   the phone after marking: name hidden, marked

  Rendered to PNG by site/art/render_textures.mjs. Every answer here is real
  algebra and every mark is correct: a maths teacher looking at the hero
  should find nothing to wince at.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Kalam:wght@400&family=Caveat:wght@600;700&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #fffdf6;
    --print: #1f1c16;
    --rule: #d9d3c2;
    --pencil: #3b3833;
    --pen: #b3271e;
    --ink: #211e15;
    --desk: #f6f1e3;
    --board: #143528;
    --tick: #1d6a44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }

  /* ------------------------------------------------------------ the sheet */
  .sheet {
    position: relative;
    width: 1800px;
    height: 2546px;                 /* A4 */
    background: var(--paper);
    color: var(--print);
    font-family: 'Public Sans', sans-serif;
    padding: 150px 150px 120px;
    overflow: hidden;
  }
  .head {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 60px;
    align-items: end;
    font-size: 40px;
    font-weight: 600;
    padding-bottom: 26px;
    border-bottom: 3px solid var(--print);
  }
  .field { display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
  .field .blank {
    position: relative;
    display: inline-block;
    min-width: 200px;
    border-bottom: 2px solid var(--print);
    height: 1.1em;
  }
  .field.name .blank { min-width: 560px; }
  .hand {
    font-family: 'Kalam', cursive;
    color: var(--pencil);
    font-weight: 400;
  }
  .field .hand {
    position: absolute;
    left: 12px;
    bottom: -8px;
    font-size: 62px;
    line-height: 1;
    white-space: nowrap;
  }
  /* The name, covered — only ever on the phone's copy, never on paper. */
  .redacted .field.name .hand::after {
    content: '';
    position: absolute;
    inset: 6px -14px 2px -10px;
    background: #0b0a07;
    border-radius: 3px;
  }

  .title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 70px 0 60px;
  }
  .title h1 { font-size: 70px; font-weight: 800; letter-spacing: -1px; }
  .title .total { font-size: 42px; font-weight: 600; }
  .title .total .blank {
    position: relative;
    display: inline-block; width: 190px; height: 1.1em;
    border-bottom: 2px solid var(--print); margin: 0 10px;
    vertical-align: baseline;
  }

  .q { position: relative; margin-bottom: 64px; }
  .q .prompt {
    display: flex; gap: 22px;
    font-size: 44px;
    line-height: 1.3;
  }
  .q .prompt b { font-weight: 800; width: 50px; flex: none; }
  .q .prompt .marks { margin-left: auto; color: #6d6656; font-size: 36px; white-space: nowrap; }
  .q .work { margin: 16px 0 0 72px; }
  .q .line {
    position: relative;
    height: 96px;
    border-bottom: 2px solid var(--rule);
    width: 1180px;
  }
  .q .line .hand {
    position: absolute;
    left: 14px;
    bottom: 4px;
    font-size: 64px;
    line-height: 1;
    white-space: nowrap;
  }
  sup { font-size: .6em; line-height: 0; vertical-align: .75em; }

  /* ------------------------------------------------------------ the marks */
  .pen { font-family: 'Caveat', cursive; color: var(--pen); font-weight: 700; position: absolute; line-height: 1; }
  .tick {
    position: absolute; right: 30px; top: 70px;
    width: 96px; height: 70px;
  }
  .tick::before, .tick::after {
    content: ''; position: absolute; background: var(--pen); border-radius: 6px; height: 12px;
  }
  .tick::before { width: 42px; left: 0; top: 36px; transform: rotate(45deg); }
  .tick::after  { width: 86px; left: 22px; top: 22px; transform: rotate(-52deg); }
  .cross { position: absolute; right: 36px; top: 60px; width: 80px; height: 80px; }
  .cross::before, .cross::after {
    content: ''; position: absolute; left: 0; top: 34px; width: 90px; height: 12px;
    background: var(--pen); border-radius: 6px;
  }
  .cross::before { transform: rotate(40deg); }
  .cross::after  { transform: rotate(-40deg); }
  /* Written in the box and ringed, a little off-square the way a hand does
     it. */
  .score {
    left: 50%; bottom: -12px;
    transform: translateX(-50%) rotate(-6deg);
    font-size: 100px;
    padding: 2px 24px 0;
    border: 6px solid var(--pen);
    border-radius: 50%;
    white-space: nowrap;
  }
  .note { font-size: 64px; }

  /* The marks only exist on the marked copy. */
  .unmarked .pen, .unmarked .tick, .unmarked .cross { display: none; }

  /* ------------------------------------------------------------ the phone */
  .phone {
    position: relative;
    width: 1080px; height: 2340px;
    overflow: hidden;
    font-family: 'Public Sans', sans-serif;
  }
  .phone .status {
    position: absolute; top: 0; left: 0; right: 0; height: 120px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 30px 70px 0;
    font-size: 40px; font-weight: 700;
    z-index: 5;
  }
  .phone .status .bat {
    width: 76px; height: 36px; border: 4px solid currentColor; border-radius: 10px; position: relative;
  }
  .phone .status .bat::after { content: ''; position: absolute; inset: 4px 14px 4px 4px; background: currentColor; border-radius: 4px; }

  /* Viewfinder: the live camera feed, so it shows what a phone pointed at a
     desk actually sees — the desk, lit, with the paper on it — not a black
     void with a page floating in it. */
  .scan {
    color: var(--ink);
    background:
      radial-gradient(ellipse 90% 70% at 45% 40%, rgba(255,250,236,.55), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 120% 90% at 50% 45%, #ece4cf 0%, #d9cfb6 100%);
  }
  /* The page, as the camera sees it: at the angle the phone is held to it
     (the Blender rig is turned --r the other way), and small enough that the
     whole sheet is in frame, which is what "page found" requires. */
  .scan .frame {
    --r: 25deg;
    position: absolute; left: 50%; top: 1010px;
    width: 612px; height: 866px;
    transform: translate(-50%, -50%) rotate(var(--r));
  }
  .scan .frame .view {
    position: absolute; left: 0; top: 0;
    width: 1800px; height: 2546px;
    transform-origin: top left;
    transform: scale(.34);
    box-shadow: 0 34px 60px rgba(60, 48, 24, .30), 0 4px 10px rgba(60, 48, 24, .18);
  }
  /* The detected edge, drawn the way scanning apps do: a quad that sits on
     the paper's real outline, turned with it. */
  .scan .frame .edge {
    position: absolute; inset: -10px;
    border: 7px solid var(--tick);
    border-radius: 6px;
    background: rgba(29, 106, 68, .07);
  }
  .scan .frame .bracket { position: absolute; width: 96px; height: 96px; border: 0 solid var(--tick); }
  .scan .frame .b1 { left: -26px;  top: -26px;    border-width: 16px 0 0 16px; border-radius: 18px 0 0 0; }
  .scan .frame .b2 { right: -26px; top: -26px;    border-width: 16px 16px 0 0; border-radius: 0 18px 0 0; }
  .scan .frame .b3 { left: -26px;  bottom: -26px; border-width: 0 0 16px 16px; border-radius: 0 0 0 18px; }
  .scan .frame .b4 { right: -26px; bottom: -26px; border-width: 0 16px 16px 0; border-radius: 0 0 18px 0; }
  .scan .hint {
    position: absolute; left: 50%; top: 1700px; transform: translateX(-50%);
    background: rgba(20, 53, 40, .92); color: #f6f1e3;
    padding: 24px 50px; border-radius: 60px;
    font-size: 42px; font-weight: 700; white-space: nowrap;
    display: flex; align-items: center; gap: 20px;
  }
  .scan .hint i { width: 24px; height: 24px; border-radius: 50%; background: #7fd3a4; }
  .scan .controls {
    position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(rgba(20, 18, 14, 0), rgba(20, 18, 14, .78) 38%);
  }
  .scan .shutter {
    position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    width: 210px; height: 210px; border-radius: 50%;
    border: 12px solid #fffdf6;
  }
  .scan .shutter::after { content: ''; position: absolute; inset: 16px; border-radius: 50%; background: #fffdf6; }

  /* Result: the app's own look — paper, chalkboard, a green tick. */
  .marked { background: var(--desk); color: var(--ink); }
  .marked .bar {
    position: absolute; top: 120px; left: 0; right: 0; height: 130px;
    display: flex; align-items: center; gap: 30px; padding: 0 60px;
    font-size: 50px; font-weight: 800; letter-spacing: -.5px;
  }
  .marked .bar .back { font-size: 64px; font-weight: 400; }
  .marked .card {
    position: absolute; left: 60px; right: 60px; top: 290px;
    background: #143528; color: #f6f1e3;
    border-radius: 44px; padding: 44px 50px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .marked .card .who { font-size: 38px; opacity: .8; font-weight: 600; }
  .marked .card .num { font-size: 120px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
  .marked .card .num small { font-size: 60px; opacity: .7; font-weight: 700; }
  .marked .chip {
    position: absolute; left: 60px; top: 560px;
    display: flex; align-items: center; gap: 20px;
    background: #fffdf6; border: 2px solid #ddd3bb;
    padding: 20px 34px; border-radius: 60px;
    font-size: 36px; font-weight: 700; color: #1d6a44;
  }
  .marked .chip i {
    width: 44px; height: 44px; border-radius: 50%; background: #1d6a44; position: relative; flex: none;
  }
  .marked .chip i::after {
    content: ''; position: absolute; left: 13px; top: 8px; width: 12px; height: 22px;
    border: solid #fffdf6; border-width: 0 6px 6px 0; transform: rotate(45deg);
  }
  .marked .page {
    position: absolute; left: 50%; top: 700px;
    width: 1800px; height: 2546px;
    transform-origin: top left;
    transform: translateX(-50%) scale(.53);
    margin-left: -423px;
    box-shadow: 0 24px 60px rgba(33,30,21,.18);
    border-radius: 20px;
  }
</style>
</head>
<body>
<template id="sheet">
  <div class="sheet">
    <div class="head">
      <div class="field name">Name <span class="blank"><span class="hand"></span></span></div>
      <div class="field">Class <span class="blank"><span class="hand"></span></span></div>
      <div class="field">Date <span class="blank"><span class="hand"></span></span></div>
    </div>

    <div class="title">
      <h1>Algebra — Quiz 3</h1>
      <!-- The score goes where a teacher writes it: in the Total box, ringed. -->
      <div class="total">Total <span class="blank"><span class="pen score"></span></span>/ 20</div>
    </div>

    <div class="qs"></div>
  </div>
</template>

<div id="out"></div>

<script>
  // Three students, so a flipped-through pile reads as a class set rather
  // than one paper cloned. Every script is real algebra and every mark is
  // right: the wrong answers are the slips students actually make, and each
  // comment names the mistake instead of gesturing at it.
  const QUESTIONS = [
    { prompt: 'Solve 3x + 5 = 20', marks: 4 },
    { prompt: 'Expand 4(2x − 3)', marks: 4 },
    { prompt: 'Factorise x<sup>2</sup> + 5x + 6', marks: 4 },
    { prompt: 'Solve 2(x − 1) = x + 7', marks: 4 },
    { prompt: 'Simplify 6x<sup>2</sup> ÷ 3x', marks: 4 },
  ];
  const VARIANTS = {
    // Ana never multiplied the −3, so 8x − 3. One method mark.
    1: { name: 'Ana Lopez', klass: '9B', date: '12/5', score: '17',
         note: 'Lovely factorising. Multiply both terms in the bracket.',
         qs: [
           { lines: ['3x = 15', 'x = 5'], mark: 'tick' },
           { lines: ['8x - 3'], mark: 'cross', award: '1', inline: '4 × −3 = −12', at: 0, left: 470 },
           { lines: ['(x + 2)(x + 3)'], mark: 'tick' },
           { lines: ['2x - 2 = x + 7', 'x = 9'], mark: 'tick' },
           { lines: ['2x'], mark: 'tick' },
         ] },
    2: { name: 'Sam Carter', klass: '9B', date: '12/5', score: '20',
         note: 'Perfect — well done.',
         qs: [
           { lines: ['3x = 15', 'x = 5'], mark: 'tick' },
           { lines: ['8x - 12'], mark: 'tick' },
           { lines: ['(x + 2)(x + 3)'], mark: 'tick' },
           { lines: ['2x - 2 = x + 7', 'x = 9'], mark: 'tick' },
           { lines: ['2x'], mark: 'tick' },
         ] },
    // Priya took the −2 across without changing its sign: 7 − 2, not 7 + 2.
    3: { name: 'Priya Shah', klass: '9B', date: '12/5', score: '16',
         note: 'Careful moving terms across: −2 becomes +2.',
         qs: [
           { lines: ['3x = 15', 'x = 5'], mark: 'tick' },
           { lines: ['8x - 12'], mark: 'tick' },
           { lines: ['(x + 2)(x + 3)'], mark: 'tick' },
           { lines: ['2x - 2 = x + 7', 'x = 5'], mark: 'cross', inline: '7 + 2, not 7 − 2', at: 1, left: 340 },
           { lines: ['2x'], mark: 'tick' },
         ] },
  };

  const params = new URLSearchParams(location.search);
  const variant = VARIANTS[params.get('v') || '1'];
  const out = document.getElementById('out');
  const s = document.getElementById('sheet').content.firstElementChild.cloneNode(true);

  const hands = s.querySelectorAll('.head .hand');
  hands[0].textContent = variant.name;
  hands[1].textContent = variant.klass;
  hands[2].textContent = variant.date;
  s.querySelector('.score').textContent = variant.score;

  const qs = s.querySelector('.qs');
  variant.qs.forEach((q, i) => {
    const el = document.createElement('div');
    el.className = 'q';
    el.innerHTML = `<div class="prompt"><b>${i + 1}.</b><span>${QUESTIONS[i].prompt}</span>` +
      `<span class="marks">[${QUESTIONS[i].marks}]</span></div><div class="work"></div>`;
    const work = el.querySelector('.work');
    q.lines.forEach((text, li) => {
      const line = document.createElement('div');
      line.className = 'line';
      line.innerHTML = `<span class="hand">${text}</span>`;
      if (q.inline && q.at === li) {
        line.innerHTML += `<span class="pen note" style="left:${q.left}px; bottom:6px;">${q.inline}</span>`;
      }
      work.appendChild(line);
    });
    el.insertAdjacentHTML('beforeend', `<div class="${q.mark}"></div>`);
    if (q.award) {
      el.insertAdjacentHTML('beforeend', `<div class="pen note" style="right:150px; top:78px;">${q.award}</div>`);
    }
    qs.appendChild(el);
  });

  s.insertAdjacentHTML('beforeend',
    `<div class="pen note" style="left:150px; bottom:150px;">${variant.note}</div>`);
  out.appendChild(s);
  document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
