name: marking_prokect_v2
description: "Markless — photograph or upload student work and get it marked, with feedback a student can act on."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  file_picker: '>=8.1.2'
  # Only passkeys_platform_interface comes in transitively -- a Dart-only
  # interface, no Passkeys Web SDK. Verified 2026-08-30: the compiled web
  # bundle contains no Passkeys reference, so no JS shim is needed to boot.
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  pdfx: ^2.6.0
  # On-device PDF authoring for pre-coded test copies. Generation is local:
  # no API cost, and it removes the credits a mis-split stack would burn.
  pdf: ^3.11.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.0.0
  image_picker: '>=1.1.2'
  camera: ^0.11.0+2
  camera_web: ^0.3.4
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  go_router: ^16.2.0
  provider: ^6.1.2
  image: ^4.9.1
  purchases_flutter: ^10.7.0
  purchases_ui_flutter: ^10.7.0
  google_mlkit_text_recognition: ^0.16.0
  # Push, so a teacher who queued a class set at bedtime hears that it's
  # marked instead of having to reopen the app to find out.
  onesignal_flutter: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/markless_icon.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/icons/markless_icon_fg.png
  remove_alpha_ios: true